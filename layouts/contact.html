{{ define "main" }}
<article class="pa3 pa4-ns nested-copy-line-height">
  <h1 class="f1">{{ .Title }}</h1>
  
  <!-- Affiche le contenu Markdown -->
  <div class="nested-copy-line-height lh-copy">
    {{ .Content }}
  </div>
  
  <!-- Formulaire de contact -->
  <h2 class="f2">Formulaire de contact</h2>
  <form action="https://formspree.io/f/ton-id" method="POST" class="lh-copy">
    <div class="mb3">
      <label class="db mb2 fw6">Nom :</label>
      <input type="text" name="name" required class="db w-100 pa2 ba b--black-20 br2">
    </div>
    
    <div class="mb3">
      <label class="db mb2 fw6">Email :</label>
      <input type="email" name="_replyto" required class="db w-100 pa2 ba b--black-20 br2">
    </div>
    
    <div class="mb3">
      <label class="db mb2 fw6">Message :</label>
      <textarea name="message" rows="5" required class="db w-100 pa2 ba b--black-20 br2"></textarea>
    </div>
    
    <input type="submit" value="Envoyer" class="f6 grow no-underline br-pill ph3 pv2 mb2 dib white bg-navy bn pointer">
  </form>
</article>
{{ end }}
